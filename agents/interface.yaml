interface:
  display_name: "Kang Meta Skill"
  short_description: "Research, create, evaluate, preserve, and safely publish Kang Skills"
  default_prompt: "Use $kang-meta-skill to inventory built-in capabilities, installed Skills, and Kang repositories before choosing Direct Reuse, Extend Existing, or Create New. Pause for my choice on partial overlap. Research public capabilities only when a real gap remains, preserve factual candidate evidence without personal branding, create or improve the package, and publish only when I explicitly request it. Keep audit-only work read-only, never push directly to main or master, never reuse a released version, and do not sync the Skill into an active directory unless I explicitly request it."
  examples:
    - "把这套重复流程整理成我的 kang skill"
    - "优化这个已有 Skill，补充触发评测和发布门禁"
    - "只审计这个 Skill 的路由和输出质量，先不要改文件"
    - "研究相关 Skill，取长补短后创建一个更好的 Kang Skill"
    - "把这个 Skill 发布到 GitHub，但不要安装到本机"
compatibility:
  canonical_format: "agent-skills"
  adapter_targets:
    - "openai"
    - "claude"
    - "generic"
    - "agent-skills-compatible"
    - "vscode"
  activation:
    mode: "manual"
    paths: []
  trust:
    source_tier: "local-reviewed"
    remote_inline_execution: "forbid"
    generated_public_claims: "evidence-bound"
  permissions:
    network: "public Skill catalogs and source repositories for read-only research; GitHub writes only when requested"
    file_write: "requested Skill package only"
    subprocess: "bundled research, validation, Git, GitHub, and optional discovery commands"
  degradation:
    catalog_unavailable: "continue with available sources and record missing evidence"
    capability_drift: "require manual review before claiming parity"
gates:
  production:
    - "one root SKILL.md"
    - "aligned agents/interface.yaml"
    - "positive, negative, and near-neighbor trigger cases"
    - "package validation and honest evidence"
  governed:
    - "secret and privacy scan"
    - "Kang-only ownership scan"
    - "reuse-first decision gate"
    - "feature branch and pull request"
    - "immutable versioned release"
    - "discovery verification"
    - "local installation only when explicitly requested"
